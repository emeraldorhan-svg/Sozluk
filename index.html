<title>Deniz Canlıları Sözlüğü</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: tek sütun, büyük dokunma alanları. Üstte başlık ve iki sekme (Keşfet, Oyun), altında canlı kartları. */
:root {
  --bg: #eaf6fb; --surface: #ffffff; --ink: #17324a; --muted: #47657c; --line: #cfe6f0;
  --accent: #1f4e79; --on-accent: #ffffff; --teal: #1b7468;
  --good: #1f8a4c; --good-bg: #def4e5; --try: #b4560f; --try-bg: #fdebd8;
  --star: #f2a900; --star-off: #c5d8e3; --shade: rgba(12, 32, 45, .55);
  --font-head: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c202d; --surface: #143347; --ink: #e9f5fb; --muted: #a9c4d6; --line: #26506b;
    --accent: #8fd0f4; --on-accent: #0c202d; --teal: #6fd9c9;
    --good: #6fdc9a; --good-bg: #17402c; --try: #f5b36b; --try-bg: #4a2f14;
    --star: #ffc933; --star-off: #35566b; --shade: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c202d; --surface: #143347; --ink: #e9f5fb; --muted: #a9c4d6; --line: #26506b;
  --accent: #8fd0f4; --on-accent: #0c202d; --teal: #6fd9c9;
  --good: #6fdc9a; --good-bg: #17402c; --try: #f5b36b; --try-bg: #4a2f14;
  --star: #ffc933; --star-off: #35566b; --shade: rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 500 17px/1.5 var(--font-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

h1 { font: 800 clamp(32px, 8.5vw, 52px)/1.02 var(--font-head); color: var(--accent); margin: 0; text-wrap: balance; }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 18px; }

.tabs { display: flex; gap: 10px; margin: 20px 0 14px; }
.tab {
  flex: 1; min-height: 58px; border-radius: 18px; border: 3px solid var(--accent);
  background: transparent; color: var(--accent); font: 800 20px var(--font-head);
}
.tab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.letters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: thin; }
.chip {
  flex: 0 0 auto; min-width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line);
  background: var(--surface); color: var(--accent); font: 800 20px var(--font-head);
}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 12px; text-align: center;
  background: var(--surface); border: 2px solid var(--line); border-radius: 22px;
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.flash { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent); }
.nm { font: 800 18px/1.15 var(--font-head); padding: 0 4px; text-wrap: balance; }
.art { position: relative; display: block; border-radius: 16px; overflow: hidden; }
.art svg { display: block; width: 100%; height: auto; }
.badge {
  position: absolute; top: 6px; left: 6px; width: 28px; height: 28px; border-radius: 50%;
  background: #1f4e79; color: #fff; font: 800 15px/28px var(--font-head); text-align: center;
}

.mover { transform-box: fill-box; transform-origin: 50% 55%; animation-delay: var(--d, 0s); }
.m-bob { animation: bob 3.2s ease-in-out infinite; }
.m-swim { animation: swim 3.8s ease-in-out infinite; }
.m-wiggle { animation: wiggle 2.6s ease-in-out infinite; }
.m-pulse { animation: pulse 2.8s ease-in-out infinite; }
.m-hop { animation: hop 2.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-7px); } }
@keyframes swim { 0%, 100% { transform: translateX(-6px) rotate(-2deg); } 50% { transform: translateX(6px) rotate(2deg); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes pulse { 50% { transform: scale(1.07); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 15% { transform: translateY(-8px); } 30% { transform: translateY(0); } 65% { transform: translateX(5px); } 85% { transform: translateX(-5px); } }
.boing { animation: boing .6s ease; }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.12, .9); } 55% { transform: scale(.94, 1.08); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 24px;
  border-radius: 29px; border: 3px solid var(--accent); background: var(--accent); color: var(--on-accent);
  font: 800 20px var(--font-head);
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn svg { width: 24px; height: 24px; flex: none; }
.vnote { margin: 10px 0 0; font-size: 15px; color: var(--muted); }

dialog {
  border: 0; padding: 0; border-radius: 28px; background: var(--surface); color: var(--ink);
  width: calc(100% - 24px); max-width: 520px; max-height: calc(100dvh - 24px); overflow: auto;
}
dialog::backdrop { background: var(--shade); }
.d-in { padding: 14px 16px 20px; }
.d-top { display: flex; justify-content: flex-end; }
.icon-btn {
  width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  color: var(--ink); display: grid; place-items: center;
}
.icon-btn svg { width: 26px; height: 26px; }
.d-art { max-width: 380px; margin: 0 auto; cursor: pointer; border-radius: 20px; overflow: hidden; }
.d-art svg { display: block; width: 100%; height: auto; }
.d-tip { text-align: center; margin: 6px 0 0; font-size: 15px; color: var(--muted); }
#d-name { font: 800 clamp(28px, 7vw, 36px)/1.1 var(--font-head); margin: 14px 0 0; color: var(--accent); text-wrap: balance; }
#d-latin { margin: 4px 0 0; font-style: italic; color: var(--teal); font-size: 17px; }
#d-desc { margin: 12px 0 0; font-size: 20px; line-height: 1.5; }
.d-actions { margin-top: 16px; }
.d-nav { display: flex; gap: 10px; margin-top: 18px; }
.d-nav .btn { flex: 1; padding: 0 12px; font-size: 18px; }

.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 18px 16px 22px; }
.g-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.g-count { font: 800 18px var(--font-head); color: var(--muted); }
.stars { display: flex; gap: 3px; }
.stars svg { width: 22px; height: 22px; fill: var(--star-off); }
.stars svg.on { fill: var(--star); }
.g-q { font: 800 clamp(26px, 6.5vw, 36px)/1.15 var(--font-head); margin: 16px 0 12px; text-wrap: balance; }
.g-q mark { background: none; color: var(--accent); }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.opt { padding: 5px; border-radius: 20px; border: 4px solid var(--line); background: var(--surface); }
.opt .art { border-radius: 13px; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--try); animation: shake .35s ease; }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right) { opacity: .5; }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 18px; font-size: 18px; line-height: 1.45; }
.fb strong { font: 800 22px var(--font-head); display: block; }
.fb.good { background: var(--good-bg); color: var(--ink); border: 2px solid var(--good); }
.fb.try { background: var(--try-bg); color: var(--ink); border: 2px solid var(--try); }
.g-next { margin-top: 16px; }
.big-stars .stars svg { width: 34px; height: 34px; }
.g-end h2 { font: 800 clamp(28px, 7vw, 38px)/1.1 var(--font-head); color: var(--accent); margin: 14px 0 6px; }
.g-end p { font-size: 19px; margin: 0 0 18px; }
.g-row { display: flex; gap: 10px; flex-wrap: wrap; }
.g-intro h2 { font: 800 clamp(28px, 7vw, 38px)/1.1 var(--font-head); color: var(--accent); margin: 0 0 8px; }
.g-intro p { font-size: 19px; margin: 0 0 18px; }
.foot { margin-top: 26px; text-align: center; color: var(--muted); font-size: 15px; }
.no-tts .listen { display: none; }

@media (prefers-reduced-motion: reduce) {
  .mover, .boing, .opt.wrong { animation: none !important; }
  .card { transition: none; }
}
</style>

<div class="wrap">
  <h1>Deniz Canlıları Sözlüğü</h1>
  <p class="sub">Bir canlıya dokun, tanış ve dinle.</p>

  <div class="tabs">
    <button class="tab" id="tab-explore" aria-pressed="true">Keşfet</button>
    <button class="tab" id="tab-game" aria-pressed="false">Oyun</button>
  </div>

  <section id="explore" aria-label="Deniz canlıları">
    <div class="letters" id="letters" aria-label="Harfler"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="game" aria-label="Oyun" hidden>
    <div class="panel" id="game-body"></div>
  </section>

  <p class="foot">26 deniz canlısı</p>
</div>

<dialog id="detail" aria-labelledby="d-name">
  <div class="d-in">
    <div class="d-top"><button class="icon-btn" id="d-close" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="d-art" id="d-art" role="img"></div>
    <p class="d-tip">Canlıya dokun, zıplasın!</p>
    <h2 id="d-name"></h2>
    <p id="d-latin"></p>
    <p id="d-desc"></p>
    <div class="d-actions">
      <button class="btn listen" id="d-listen"></button>
      <p class="vnote" hidden>Bu cihazda Türkçe ses bulunamadı. Okuma sesi doğru çıkmayabilir.</p>
    </div>
    <div class="d-nav">
      <button class="btn ghost" id="d-prev" aria-label="Önceki canlı"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Önceki</button>
      <button class="btn ghost" id="d-next" aria-label="Sonraki canlı">Sonraki<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</dialog>

const $ = (s, r) => (r || document).querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON = {
  speaker: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10z"/><path fill="none" d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>'
};
const LISTEN = ICON.speaker + 'Dinle';
const STOP = ICON.stop + 'Durdur';

/* ---------- Ses ---------- */
const hasTTS = 'speechSynthesis' in window;
if (!hasTTS) document.documentElement.classList.add('no-tts');
let voice = null, speakingBtn = null;
function pickVoice() {
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^tr/i.test(v.lang)) || null;
  const missing = vs.length > 0 && !voice;
  document.querySelectorAll('.vnote').forEach(n => { n.hidden = !missing; });
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function resetSpeakBtn() {
  if (speakingBtn) { speakingBtn.innerHTML = LISTEN; speakingBtn = null; }
}
function stopSpeak() {
  if (hasTTS) speechSynthesis.cancel();
  resetSpeakBtn();
}
function speak(text, btn) {
  if (!hasTTS) return;
  if (speakingBtn === btn) { stopSpeak(); return; }
  stopSpeak();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'tr-TR';
  if (voice) u.voice = voice;
  u.rate = 0.9; u.pitch = 1.1;
  u.onend = u.onerror = () => { if (speakingBtn === btn) resetSpeakBtn(); };
  speakingBtn = btn;
  btn.innerHTML = STOP;
  speechSynthesis.speak(u);
}

/* ---------- Keşfet ---------- */
const grid = $('#grid');
C.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.i = i;
  b.setAttribute('aria-label', c.name);
  b.style.setProperty('--d', (-(i % 7) * 0.45) + 's');
  b.innerHTML = '<span class="art">' + c.svg + '<span class="badge" aria-hidden="true">' + c.letter + '</span></span><span class="nm">' + c.name + '</span>';
  b.addEventListener('click', () => openDetail(i));
  grid.appendChild(b);
});

const letters = $('#letters');
[...new Set(C.map(c => c.letter))].forEach(L => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = L;
  b.setAttribute('aria-label', L + ' harfi');
  b.addEventListener('click', () => {
    const card = grid.children[C.findIndex(c => c.letter === L)];
    card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 1400);
  });
  letters.appendChild(b);
});

/* ---------- Ayrıntı penceresi ---------- */
const dlg = $('#detail'), dArt = $('#d-art'), dListen = $('#d-listen');
let cur = -1;
dListen.innerHTML = LISTEN;
function openDetail(i, fromHash) {
  const c = C[i];
  cur = i;
  stopSpeak();
  dArt.innerHTML = c.svg;
  dArt.setAttribute('aria-label', c.name + ' çizimi');
  $('#d-name').textContent = c.name;
  $('#d-latin').textContent = c.latin;
  $('#d-desc').textContent = c.desc;
  if (!fromHash) { try { if (location.hash !== '#' + c.slug) location.hash = c.slug; } catch (e) {} }
  if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
}
function closeDetail() { if (dlg.open) dlg.close(); }
dlg.addEventListener('close', () => {
  stopSpeak();
  try { if (C.some(c => '#' + c.slug === location.hash)) location.hash = ''; } catch (e) {}
});
dlg.addEventListener('click', e => { if (e.target === dlg) closeDetail(); });
$('#d-close').addEventListener('click', closeDetail);
$('#d-prev').addEventListener('click', () => openDetail((cur + C.length - 1) % C.length));
$('#d-next').addEventListener('click', () => openDetail((cur + 1) % C.length));
dListen.addEventListener('click', () => { const c = C[cur]; speak(c.name + '. ' + c.desc, dListen); });
dArt.addEventListener('click', () => {
  const s = dArt.querySelector('svg');
  s.classList.remove('boing'); void s.getBoundingClientRect(); s.classList.add('boing');
});
dArt.addEventListener('animationend', e => { if (e.target.classList && e.target.classList.contains('boing')) e.target.classList.remove('boing'); });

/* ---------- Sekmeler ve adres ---------- */
let tab = 'explore';
function setTab(name) {
  tab = name;
  $('#explore').hidden = name !== 'explore';
  $('#game').hidden = name !== 'game';
  $('#tab-explore').setAttribute('aria-pressed', String(name === 'explore'));
  $('#tab-game').setAttribute('aria-pressed', String(name === 'game'));
  if (name === 'game') { if (!gameStarted) renderIntro(); } else { stopSpeak(); }
}
function route() {
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (h === 'oyun') { closeDetail(); setTab('game'); return; }
  const i = C.findIndex(c => c.slug === h);
  if (i >= 0) { setTab('explore'); if (!dlg.open || cur !== i) openDetail(i, true); return; }
  closeDetail();
  setTab('explore');
}
$('#tab-explore').addEventListener('click', () => { setTab('explore'); try { location.hash = ''; } catch (e) {} });
$('#tab-game').addEventListener('click', () => { setTab('game'); try { location.hash = 'oyun'; } catch (e) {} });
window.addEventListener('hashchange', route);

/* ---------- Oyun ---------- */
const gb = $('#game-body');
const TOTAL = 10;
let gameStarted = false, order = [], round = 0, results = [], wrongs = 0, locked = false;
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function starsHTML() {
  let s = '';
  for (let r = 0; r < TOTAL; r++) s += results[r] === true ? ICON.star.replace('<svg ', '<svg class="on" ') : ICON.star;
  return '<span class="stars" role="img" aria-label="' + results.filter(Boolean).length + ' yıldız">' + s + '</span>';
}
function renderIntro() {
  gameStarted = true;
  gb.innerHTML = '<div class="g-intro"><h2>Bu hangi canlı?</h2><p>Bir canlının adını göreceksin. Adı oku ya da dinle, sonra doğru çizimi bul. 10 soru var. İlk denemede bulursan yıldız kazanırsın.</p><button class="btn" id="g-start">Başla</button></div>';
}
function startGame() {
  order = shuffle(C.map((_, k) => k)).slice(0, TOTAL);
  round = 0; results = [];
  renderRound();
}
function renderRound() {
  stopSpeak();
  const idx = order[round], t = C[idx];
  const others = shuffle(C.map((_, k) => k).filter(k => k !== idx)).slice(0, 2);
  const opts = shuffle([idx].concat(others));
  wrongs = 0; locked = false;
  gb.innerHTML =
    '<div class="g-top"><span class="g-count">Soru ' + (round + 1) + ' / ' + TOTAL + '</span>' + starsHTML() + '</div>' +
    '<p class="g-q">Hangisi <mark>' + t.name + '</mark>?</p>' +
    '<button class="btn ghost listen" id="g-listen">' + LISTEN + '</button>' +
    '<p class="vnote" hidden>Bu cihazda Türkçe ses bulunamadı. Okuma sesi doğru çıkmayabilir.</p>' +
    '<div class="opts">' + opts.map((k, n) => '<button class="opt" data-k="' + k + '" aria-label="Seçenek ' + (n + 1) + '"><span class="art">' + C[k].svg + '</span></button>').join('') + '</div>' +
    '<div class="fb" id="fb" aria-live="polite" hidden></div>' +
    '<div class="g-next" id="g-nextwrap"></div>';
  pickVoice();
}
function choose(b) {
  if (locked || b.disabled) return;
  const k = +b.dataset.k, idx = order[round], t = C[idx], fb = $('#fb');
  if (k === idx) {
    locked = true;
    results[round] = wrongs === 0;
    gb.querySelectorAll('.opt').forEach(o => { o.disabled = true; });
    b.classList.add('right');
    fb.hidden = false; fb.className = 'fb good';
    fb.innerHTML = '<strong>Aferin!</strong>Bu ' + t.name + '. ' + t.desc;
    $('.stars', gb).outerHTML = starsHTML();
    const last = round === TOTAL - 1;
    $('#g-nextwrap').innerHTML = '<button class="btn" id="g-next">' + (last ? 'Bitir' : 'Sıradaki') + '</button>';
    $('#g-next').focus();
  } else {
    wrongs++;
    b.classList.add('wrong'); b.disabled = true;
    fb.hidden = false; fb.className = 'fb try';
    fb.innerHTML = '<strong>Olmadı, tekrar dene!</strong>Başka bir çizime dokun.';
  }
}
function renderEnd() {
  stopSpeak();
  const score = results.filter(Boolean).length;
  const msg = score >= 9 ? 'Harika! Sen bir deniz uzmanısın.' : score >= 6 ? 'Çok güzel! Denizi iyi tanıyorsun.' : 'Güzel deneme! Canlılara bir daha göz at, sonra tekrar dene.';
  gb.innerHTML = '<div class="g-end big-stars">' + starsHTML() + '<h2>' + TOTAL + ' sorudan ' + score + ' tanesini ilk denemede buldun</h2><p>' + msg + '</p><div class="g-row"><button class="btn" id="g-again">Tekrar oyna</button><button class="btn ghost" id="g-browse">Canlılara bak</button></div></div>';
}
gb.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'g-start' || b.id === 'g-again') startGame();
  else if (b.id === 'g-listen') speak(C[order[round]].name, b);
  else if (b.id === 'g-next') { round++; if (round < TOTAL) renderRound(); else renderEnd(); }
  else if (b.id === 'g-browse') { setTab('explore'); try { location.hash = ''; } catch (e2) {} }
  else if (b.classList.contains('opt')) choose(b);
});

route();
</script>
